<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Headline FM | Generate Icons</title>
    <style>
        body {
            background: #09090f;
            color: #d8d8ee;
            font-family: monospace;
            padding: 30px;
            text-align: center;
        }

        h2 {
            color: #ff6b35;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        p {
            color: #7070a0;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .btn {
            background: transparent;
            border: 1px solid #ff6b35;
            color: #ff6b35;
            padding: 12px 28px;
            cursor: pointer;
            font-family: monospace;
            font-size: 15px;
            letter-spacing: 2px;
            border-radius: 5px;
        }

        .btn:hover {
            background: rgba(255, 107, 53, .1);
        }

        canvas {
            display: none;
        }
    </style>
</head>

<body>
    <h2>📡 NEWSREP ICON GENERATOR</h2>
    <p>Click the button to generate and download all required icon PNGs.<br>
        Move them into <code>assets/icons/</code> in the extension folder.</p>
    <button class="btn" onclick="generateAll()">GENERATE &amp; DOWNLOAD ICONS</button>

    <canvas id="c"></canvas>

    <script>
        /**
         * Draws the NewsRep icon at a given size and downloads it as PNG.
         * Design: dark bg · orange signal arc · "HL" monogram
         */
        function drawIcon(size) {
            const canvas = document.getElementById('c');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2;
            const cy = size / 2;
            const r = size / 2;

            // Background — dark rounded square
            ctx.clearRect(0, 0, size, size);
            const cornerR = size * 0.18;
            ctx.beginPath();
            ctx.moveTo(cornerR, 0);
            ctx.lineTo(size - cornerR, 0);
            ctx.quadraticCurveTo(size, 0, size, cornerR);
            ctx.lineTo(size, size - cornerR);
            ctx.quadraticCurveTo(size, size, size - cornerR, size);
            ctx.lineTo(cornerR, size);
            ctx.quadraticCurveTo(0, size, 0, size - cornerR);
            ctx.lineTo(0, cornerR);
            ctx.quadraticCurveTo(0, 0, cornerR, 0);
            ctx.closePath();
            ctx.fillStyle = '#09090f';
            ctx.fill();

            // Orange glow ring
            const grad = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
            grad.addColorStop(0, 'rgba(255,107,53,0.0)');
            grad.addColorStop(1, 'rgba(255,107,53,0.25)');
            ctx.fillStyle = grad;
            ctx.fill();

            // Signal arcs — three concentric arcs (retro broadcast style)
            const arcBase = size * 0.14;
            const arcGap = size * 0.11;
            const dot = size * 0.065;
            const arcY = cy + size * 0.08;
            const arcX = cx;

            ctx.strokeStyle = '#ff6b35';
            ctx.lineCap = 'round';

            for (let i = 2; i >= 0; i--) {
                const ar = arcBase + arcGap * i;
                ctx.beginPath();
                ctx.arc(arcX, arcY, ar, Math.PI * 1.1, Math.PI * 1.9);
                ctx.lineWidth = size * 0.045 - i * size * 0.008;
                ctx.globalAlpha = 1 - i * 0.22;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // Center dot
            ctx.beginPath();
            ctx.arc(arcX, arcY, dot, 0, Math.PI * 2);
            ctx.fillStyle = '#ff6b35';
            ctx.shadowColor = '#ff6b35';
            ctx.shadowBlur = size * 0.12;
            ctx.fill();
            ctx.shadowBlur = 0;

            // "HL" text (only readable at larger sizes)
            if (size >= 48) {
                ctx.font = `bold ${size * 0.22}px 'Courier New', monospace`;
                ctx.fillStyle = '#00d4ff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('HL', cx, cy - size * 0.16);
            }
        }

        function downloadPng(size, filename) {
            drawIcon(size);
            const canvas = document.getElementById('c');
            const a = document.createElement('a');
            a.download = filename;
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        function generateAll() {
            const sizes = [
                { size: 16, name: 'icon16.png' },
                { size: 48, name: 'icon48.png' },
                { size: 128, name: 'icon128.png' },
            ];
            // Stagger downloads slightly so browser doesn't block them
            sizes.forEach(({ size, name }, i) => {
                setTimeout(() => downloadPng(size, name), i * 300);
            });
        }
    </script>
</body>

</html>
