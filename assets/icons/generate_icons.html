<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Headline FM — Icon Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #090909;
            color: #f0f0f0;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 40px 24px;
        }

        .header {
            text-align: center;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #f0f0f0;
        }

        h1 span {
            color: #FF9F0A;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 13px;
            color: #636363;
            line-height: 1.6;
        }

        .preview-row {
            display: flex;
            align-items: flex-end;
            gap: 28px;
        }

        .preview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .preview-item canvas {
            border-radius: 22%;
            display: block;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .preview-label {
            font-size: 11px;
            font-weight: 500;
            color: #636363;
            letter-spacing: 0.3px;
        }

        .btn {
            background: linear-gradient(180deg, #1e1e1e 0%, #141414 100%);
            border: 1px solid rgba(255, 255, 255, 0.11);
            color: #f0f0f0;
            padding: 13px 32px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.1px;
            border-radius: 12px;
            transition: background 200ms ease, border-color 200ms ease,
                box-shadow 200ms ease, transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #FF9F0A;
            box-shadow: 0 0 7px #FF9F0A;
            flex-shrink: 0;
        }

        .btn:hover {
            background: linear-gradient(180deg, #232323 0%, #191919 100%);
            border-color: rgba(255, 159, 10, 0.22);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 159, 10, 0.08);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .hint {
            font-size: 11px;
            color: #313131;
        }

        .hint code {
            font-size: 11px;
            color: #FF9F0A;
            background: rgba(255, 159, 10, 0.10);
            padding: 1px 5px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Headline<span>FM</span> Icon Generator</h1>
        <p class="subtitle">
            Renders all icon sizes with the new minimal design.<br>
            Move downloaded files into <code
                style="font-size:12px;color:#FF9F0A;background:rgba(255,159,10,0.10);padding:1px 5px;border-radius:4px;">assets/icons/</code>
            after downloading.
        </p>
    </div>

    <!-- Live previews -->
    <div class="preview-row" id="previewRow">
        <div class="preview-item">
            <canvas id="prev128" width="128" height="128"></canvas>
            <span class="preview-label">128 × 128</span>
        </div>
        <div class="preview-item">
            <canvas id="prev48" width="48" height="48"></canvas>
            <span class="preview-label">48 × 48</span>
        </div>
        <div class="preview-item">
            <canvas id="prev16" width="16" height="16"></canvas>
            <span class="preview-label">16 × 16</span>
        </div>
    </div>

    <button class="btn" onclick="generateAll()">
        <span class="btn-dot"></span>
        Generate &amp; Download Icons
    </button>

    <p class="hint">
        3 files will download: <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code>
    </p>

    <!-- Off-screen canvas used for download -->
    <canvas id="c" style="display:none"></canvas>

    <script>
        /**
         * HeadlineFM — Icon renderer
         *
         * Design language: Apple × Nothing
         * - Near-black rounded-square background with a subtle gradient
         * - Amber centre dot (solid)
         * - Two thin concentric rings at decreasing opacity — minimal broadcast motif
         * - "FM" wordmark in Space Grotesk at 48 px and above
         * - No neon glow, no retro arcs, no scan-lines
         */
        function drawIcon(ctx, size) {
            const cx = size / 2;
            const cy = size / 2;
            const cr = size * 0.22;   // rounded-corner radius (≈ iOS icon shape)

            ctx.clearRect(0, 0, size, size);

            // ── Background ────────────────────────────────────────────────
            // Slightly lighter at top-left → dark at bottom-right (subtle depth)
            const bgGrad = ctx.createLinearGradient(0, 0, size, size);
            bgGrad.addColorStop(0, '#161616');
            bgGrad.addColorStop(1, '#0a0a0a');

            roundRect(ctx, 0, 0, size, size, cr);
            ctx.fillStyle = bgGrad;
            ctx.fill();

            // Very faint amber ambient at the centre
            const ambient = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.55);
            ambient.addColorStop(0, 'rgba(255,159,10,0.08)');
            ambient.addColorStop(1, 'rgba(255,159,10,0)');
            roundRect(ctx, 0, 0, size, size, cr);
            ctx.fillStyle = ambient;
            ctx.fill();

            // ── Concentric rings ──────────────────────────────────────────
            // Outer ring — very thin, low opacity
            const ringOuter = size * 0.34;
            ctx.beginPath();
            ctx.arc(cx, cy, ringOuter, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,159,10,0.18)';
            ctx.lineWidth = Math.max(0.8, size * 0.012);
            ctx.stroke();

            // Inner ring — slightly more visible
            const ringInner = size * 0.22;
            ctx.beginPath();
            ctx.arc(cx, cy, ringInner, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,159,10,0.30)';
            ctx.lineWidth = Math.max(0.8, size * 0.014);
            ctx.stroke();

            // ── Centre dot ────────────────────────────────────────────────
            const dotR = size * 0.082;
            ctx.beginPath();
            ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
            ctx.fillStyle = '#FF9F0A';
            ctx.shadowColor = 'rgba(255,159,10,0.55)';
            ctx.shadowBlur = size * 0.10;
            ctx.fill();
            ctx.shadowBlur = 0;

            // ── Wordmark (48 px and above only) ───────────────────────────
            if (size >= 48) {
                const fontSize = size * 0.195;
                // Use system stack — canvas can't load web fonts reliably,
                // but -apple-system / BlinkMacSystemFont is always available
                ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // "FM" sits just below centre so it clears the dot
                const textY = cy + size * 0.295;

                // Dim white
                ctx.fillStyle = 'rgba(240,240,240,0.82)';
                ctx.fillText('FM', cx, textY);
            }
        }

        /** Reusable rounded-rect path helper */
        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        /** Render to the shared off-screen canvas and trigger a download */
        function downloadPng(size, filename) {
            const canvas = document.getElementById('c');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            drawIcon(ctx, size);
            const a = document.createElement('a');
            a.download = filename;
            a.href = canvas.toDataURL('image/png');
            a.click();
        }

        /** Render all three preview canvases on load */
        function renderPreviews() {
            [
                { id: 'prev128', size: 128 },
                { id: 'prev48', size: 48 },
                { id: 'prev16', size: 16 },
            ].forEach(({ id, size }) => {
                const canvas = document.getElementById(id);
                const ctx = canvas.getContext('2d');
                drawIcon(ctx, size);
            });
        }

        function generateAll() {
            const sizes = [
                { size: 16, name: 'icon16.png' },
                { size: 48, name: 'icon48.png' },
                { size: 128, name: 'icon128.png' },
            ];
            // Stagger downloads so the browser doesn't suppress them
            sizes.forEach(({ size, name }, i) => {
                setTimeout(() => downloadPng(size, name), i * 350);
            });
        }

        // Show live previews immediately on page load
        renderPreviews();
    </script>
</body>

</html>
